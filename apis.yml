aid: cowboy
name: Cowboy
description: 'Cowboy is a Brussels-based mobility company that designs and manufactures
  premium connected electric bicycles for urban commuting. Its lineup — the Cruiser,
  Cruiser ST, Cross, and Cross ST — pairs a lightweight frame with removable batteries,
  integrated GPS tracking, crash detection, and its proprietary AdaptivePower motor
  assistance, all managed through the Cowboy mobile app. The company sells direct-to-consumer
  and through a network of 125+ service centers and mobile technicians across 40+
  European cities, complemented by leasing, business, and student programs. Backed
  by Index Ventures, Cowboy operates a Shopify-based storefront and a connected-bike
  app platform; it does not publish a public developer API. This profile was added
  to the API Evangelist network as a portfolio-company lead and enriched with the
  company''s real identity, legal, support, and security surfaces.'
